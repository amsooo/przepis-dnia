name: Codzienny przepis
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC, czyli 7:00 lub 8:00 w Polsce
  workflow_dispatch:
concurrency: { group: ig-bot, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m src.main propose
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          IG_TOKEN_DATE: ${{ vars.IG_TOKEN_DATE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Zapisz stan
        run: |
          git config user.name "przepis-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A state.json history.json media
          git diff --cached --quiet || (git commit -m "Nowy przepis do akceptacji" && git pull --rebase origin main && git push)
