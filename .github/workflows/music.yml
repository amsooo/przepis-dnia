name: Muzyka – wygeneruj bibliotekę podkładów
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Ile ścieżek (po ok. 19 s); istniejące są pomijane, więc ponowne uruchomienie dokańcza brakujące"
        default: "10"
concurrency: { group: ig-bot, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m src.make_music ${{ inputs.count }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MUSIC_KEY: ${{ secrets.MUSIC_KEY }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      - name: Zapisz bibliotekę (także częściową po błędzie)
        if: always()
        run: |
          git config user.name "przepis-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A assets/music
          git diff --cached --quiet || (git commit -m "Biblioteka podkładów muzycznych (zaszyfrowana)" && git pull --rebase origin main && git push)
