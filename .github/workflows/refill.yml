name: Zapas przepisów
on:
  schedule:
    - cron: "17 2 * * *"   # w nocy, gdy Gemini zwykle jest mniej obciążony
  workflow_dispatch:
concurrency: { group: ig-bot, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  refill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m src.main refill
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Zapisz stan
        run: |
          git config user.name "przepis-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A state.json
          git diff --cached --quiet || (git commit -m "Zapas przepisów" && git pull --rebase origin main && git push)
