name: Odbiór decyzji z Telegrama
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency: { group: ig-bot, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m src.main poll
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Zapisz stan
        run: |
          git config user.name "przepis-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A state.json history.json media
          git diff --cached --quiet || (git commit -m "Aktualizacja po decyzji" && git pull --rebase origin main && git push)
