name: Konfiguracja (chat_id i test sekretów)
on:
  workflow_dispatch:
    inputs:
      krok:
        description: "whoami = odeślij mi chat_id na Telegramie, check = sprawdź sekrety i wyślij test, models = pokaż modele Gemini"
        type: choice
        options: [whoami, check, models]
        default: whoami
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m src.setup_check ${{ inputs.krok }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
